name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "Для коммита $GITHUB_SHA нет успешного прогона CI — деплой отменён" >&2
            exit 1
          fi

      - name: Set image name
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}/front:${GITHUB_SHA}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            User ubuntu
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh server "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh server IMAGE="$IMAGE" bash -s <<'EOF'
          set -euo pipefail

          docker pull "$IMAGE"
          docker logout ghcr.io

          rollback() {
            docker logs --tail 50 front 2>/dev/null || true
            docker rm -f front 2>/dev/null || true
            if docker container inspect front_prev >/dev/null 2>&1; then
              echo "Возвращаем предыдущую версию" >&2
              docker rename front_prev front
              docker start front
            fi
            exit 1
          }

          if docker container inspect front >/dev/null 2>&1; then
            docker rm -f front_prev 2>/dev/null || true
            docker stop front
            docker rename front front_prev
          fi

          docker run -d --name front --restart unless-stopped -p 80:8000 "$IMAGE" || rollback

          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null http://127.0.0.1/; then
              echo "front is up"
              docker rm -f front_prev 2>/dev/null || true
              docker image prune -f
              exit 0
            fi
            sleep 2
          done

          echo "Фронт не ответил на /" >&2
          rollback
          EOF
